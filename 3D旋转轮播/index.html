<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D旋转轮播图</title>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            height: 100vh;
            background-image: linear-gradient(to top, #9795f0 0%, #fbc8d4 100%);
            overflow: hidden;
        }

        .shell {
            position: relative;
            width: 60vw;
            height: 40vw;
            max-width: 380px;
            max-height: 250px;
            margin: 0;
            color: white;
            perspective: 1000px;
            transform-origin: center;
        }

        .content {
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            width: 100%;
            height: 100%;
            transform-origin: center;
            transform-style: preserve-3d;
            transform: translateZ(-30vw) rotateY(0);
            animation: carousel 9s infinite cubic-bezier(0.77, 0, 0.175, 1) forwards;
        }

        .item {
            position: absolute;
            width: 60vw;
            height: 40vw;
            max-width: 380px;
            max-height: 250px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
            border-radius: 6px;
            background-size: cover;
            transition: transform 0.5s ease-in-out;
            animation-timing-function: linear;
            -webkit-box-reflect: below 25px -webkit-linear-gradient(transparent 50%, rgba(255, 255, 255, 0.3));
        }

        .item:nth-child(1) {
            background-image: url(../img/前端好看壁纸图片/01chun.jpeg);
            transform: rotateY(0) translateZ(35vw);
        }

        .item:nth-child(2) {
            background-image: url(../img/前端好看壁纸图片/02xia.jpeg);
            transform: rotateY(90deg) translateZ(35vw);
        }

        .item:nth-child(3) {
            background-image: url(../img/前端好看壁纸图片/03qiu.jpeg);
            transform: rotateY(180deg) translateZ(35vw);
        }

        .item:nth-child(4) {
            background-image: url(../img/前端好看壁纸图片/04dong.jpeg);
            transform: rotateY(270deg) translateZ(35vw);
        }

        @keyframes carousel {

            0%,
            12% {
                transform: translateZ(-35vw) rotateY(0);
            }

            24%,
            36% {
                transform: translateZ(-35vw) rotateY(-90deg);
            }

            48%,
            60% {
                transform: translateZ(-35vw) rotateY(-180deg);
            }

            72%,
            84% {
                transform: translateZ(-35vw) rotateY(-270deg);
            }

            100% {
                transform: translateZ(-35vw) rotateY(-360deg);
            }
        }
    </style>
</head>

<body>
    <div class="shell">
        <div class="content">
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
        </div>
    </div>
</body>

</html>
