<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>流彩登录</title>
    <link rel="stylesheet" href="new.css">
</head>

<body>
    <div class="container">
        <span></span>
        <span></span>
        <span></span>

        <form action="" id="signinForm">
            <h2>Login</h2>
            <div class="inputBox">
                <input type="text" name="" id="" placeholder="UserName">
            </div>
            <div class="inputBox">
                <input type="password" name="" id="" placeholder="PassWord">
            </div>
            <div class="inputBox group">
                <a href="#">Forgot Password</a>
                <a href="#" id="signup">Signup</a>
            </div>
            <div class="inputBox">
                <input type="submit" name="" id="" value="Sign in">
            </div>
        </form>

        <form action="" id="signupForm">
            <h2>Registration</h2>
            <div class="inputBox">
                <input type="text" name="" id="" placeholder="UserName">
            </div>
            <div class="inputBox">
                <input type="email" name="" id="" placeholder="Email Address">
            </div>
            <div class="inputBox">
                <input type="password" name="" id="" placeholder="Create PassWord">
            </div>
            <div class="inputBox">
                <input type="password" name="" id="" placeholder="Confirm PassWord">
            </div>
            <div class="inputBox">
                <input type="submit" name="" id="" value="Register Account">
            </div>
            <div class="inputBox group">
                <a href="#">Already Have an Account?
                    <b id="signin">Login</b>
                </a>
            </div>
        </form>
    </div>
</body>
<script>
    let signup = document.querySelector('#signup')
    let signin = document.querySelector('#signin')
    let body = document.querySelector('.container')
    signup.onclick = function () {
        body.classList.add('signup')
    }
    signin.onclick = function () {
        body.classList.remove('signup')
    }
</script>

</html>
