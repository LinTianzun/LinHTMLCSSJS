<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="stylesheet" href="./star.css">
	<script src="http://code.jquery.com/jquery-latest.js"></script>
	<title>七夕</title>
</head>

<body>
	<!-- 背景盒子 -->
	<div class="star"></div>
	<!-- 流星盒子 -->
	<div class="meteor"></div>
	<!-- 心形 -->
	<div class="heart"></div>
	<p>我携漫天星辰赠与你 七夕快乐！ (●'◡'●)</p>
</body>
<script>
	const body = document.body
	//星星脚本代码
	const starCreate = () => {
		let star = ''
		//生成星星数量
		for (let i = 0; i < 10; i++) {
			star = document.createElement('div')
			star.classList.add('star')
			let r = Math.random() * 4 + 2  //半径在2-4之间
			star.style.with = r + 'px'
			star.style.height = r + 'px'
			//横坐标
			star.style.left = Math.random() * innerWidth + 'px'
			//纵坐标
			star.style.top = Math.random() * innerHeight + 'px'
			body.append(star)
		}
		//定时清理
		setTimeout(() => {
			star.remove()
		}, 450)
	}
	setInterval(() => {
		starCreate()
	}, 900);

	//流星脚本代码
	const meteorCreate = () => {
		let meteor = ''
		meteor = document.createElement('div')
		meteor.classList.add('meteor')
		meteor.style.with = Math.random() * 10 + 100 + 'px'
		//横坐标
		meteor.style.left = Math.random() * innerWidth + 'px'
		//纵坐标
		meteor.style.top = Math.random() * innerHeight + 'px'
		body.append(meteor)
		//定时清理
		setTimeout(() => {
			meteor.remove()
		}, 400)
	}
	setInterval(() => {
		meteorCreate()
	}, 1000);
	
	//文字脚本代码
	const p = document.querySelector('p')
	setTimeout(() => {
		p.style.display = 'block'
	}, 10000)
</script>

</html>
