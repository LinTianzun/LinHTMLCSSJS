<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #con {
            position: relative;
            width: 1600px;
            height: 300px;
            overflow: hidden;
        }

        ul {
            position: absolute;
            left: 0;
            width: 1600px;
            height: 200px;
        }

        li {
            width: 300px;
            list-style: none;
            float: left;
            padding-right: 20px;
        }

        img {
            width: 300px;
            height: 200px;
        }

        #bu {
            width: 400px;
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
        }

        .bu {
            width: 80px;
            height: 35px;
            margin: 0 50px;
        }
    </style>
</head>

<body>
    <div id="con">
        <ul>
            <li><img src="../../img/qq/01.jpg" alt=""></li>
            <li><img src="../../img/qq/08.jpg" alt=""></li>
            <li><img src="../../img/qq/23.jpg" alt=""></li>
            <li><img src="../../img/qq/25.jpg" alt=""></li>
            <li><img src="../../img/qq/27.jpg" alt=""></li>
        </ul>
        <div id="bu">
            <button class="bu"> <-向左走 </button>
                    <button class="bu"> 向右走-> </button>
        </div>
    </div>

    <script>
        let oUl = document.querySelector('ul')
        oUl.innerHTML += oUl.innerHTML
        let aLi = document.querySelectorAll('li')
        let aBu = document.querySelectorAll('.bu')
        oUl.style.width = aLi[0].offsetWidth * aLi.length + 'px'
        let speed = -2

        let move = () => {
            if (oUl.offsetLeft < -oUl.offsetWidth / 2) {
                oUl.style.left = '0'
            }
            if (oUl.offsetLeft > 0) {
                oUl.style.left = -oUl.offsetWidth / 2 + 'px'
            }
            oUl.style.left = oUl.offsetLeft + speed + 'px'
        }

        let timer = setInterval(move, 30)

        oUl.addEventListener('mouseover', function () {
            clearInterval(timer)
        })
        oUl.addEventListener('mouseout', function () {
            timer = setInterval(move, 30)
        })

        aBu[0].onclick = function () {
            speed = -2
        }

        aBu[1].onclick = function () {
            speed = 2
        }

    </script>
</body>

</html>
