<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="//at.alicdn.com/t/c/font_4375159_kjejnbquk9.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ccc;
            font-family: sans-serif;
        }

        ul {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
        }

        ul li {
            list-style: none;
            margin: 0 25px;
        }

        ul li a {
            text-decoration: none;
            display: block;
            width: 210px;
            height: 80px;
            background-color: #fff;
            text-align: left;
            padding-left: 20px;
            transform: rotate(-30deg) skewX(25deg);
            box-shadow: -20px 20px 10px rgba(0, 0, 0, .5);
            transition: .5s;
        }

        ul li a::before {
            content: '';
            position: absolute;
            top: 10px;
            left: -20px;
            height: 100%;
            width: 20px;
            background-color: #b1b1b1;
            transform: rotate(0deg) skewY(-45deg);
            transition: .5s;
        }

        ul li a::after {
            content: '';
            position: absolute;
            bottom: -20px;
            left: -10px;
            height: 20px;
            width: 100%;
            background-color: #b1b1b1;
            transform: rotate(0deg) skewX(-45deg);
            transition: .5s;
        }

        ul li a .i {
            font-size: 40px;
            color: #333;
            line-height: 80px;
            padding-right: 14px;
            transition: .5s;
        }

        ul li a span {
            position: absolute;
            top: 30px;
            color: #333;
            letter-spacing: 2px;
            transition: .5s;
        }

        ul li:hover a {
            background-color: #dd4b39;
            transform: rotate(-30deg) skew(25deg) translate(20px, -15px);
            box-shadow: -50px 50px 50px rgba(0, 0, 0, .5);
        }

        ul li:hover .i,
        ul li:hover span {
            color: #fff;
        }

        ul li:hover a::before {
            background-color: #b33a2b;
        }

        ul li:hover a::after {
            background-color: #e66a5a;
        }
    </style>
</head>

<body>
    <ul>
        <li>
            <a href="">
                <i class="iconfont icon-Youtube-fill i"></i>
                <span> - YouTub</span>
            </a>
        </li>
        <li>
            <a href="">
                <i class="iconfont icon-QQ-circle-fill i"></i>
                <span> - QQ</span>
            </a>
        </li>
        <li>
            <a href="">
                <i class="iconfont icon-twitter-circle-fill i"></i>
                <span> - Twitter</span>
            </a>
        </li>
        <li>
            <a href="">
                <i class="iconfont icon-wechat-fill i"></i>
                <span> - Wechat</span>
            </a>
        </li>
    </ul>
</body>

</html>
