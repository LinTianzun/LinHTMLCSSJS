<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>流彩菜单</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="//at.alicdn.com/t/c/font_4375159_fvvh0zz2dpa.css">
    <link rel="stylesheet" href="//at.alicdn.com/t/c/font_4375159_e4i2lvwunoo.css">
</head>

<body>
    <div class="container">
        <div class="sidebar ">

            <!-- 侧边栏头部 -->
            <div class="head">
                <div class="user-img">
                    <img src="../../img/qq/10.png" alt="">
                </div>
                <div class="user-details">
                    <p class="title">Web 工程师</p>
                    <p class="name">林知雨</p>
                </div>
                <div class="user-logo">
                    <i class="iconfont icon-logo-apple-ar "></i>
                </div>
            </div>

            <!-- 尝试 -->
            <span class="ssp"></span>
            <span class="ssp"></span>
            <span class="ssp"></span>

            <!-- 侧边栏内容  -->
            <div class="nav">
                <div class="menu">
                    <p class="title">Main</p>
                    <ul>

                        <li class="active">
                            <a href="#">
                                <i class="iconfont icon-home"></i>
                                <span class="text">主页</span>
                            </a>
                        </li>

                        <li>
                            <a href="#">
                                <i class="iconfont icon-user"></i>
                                <span class="text">用户管理</span>
                                <i class="iconfont icon-down arrow"></i>
                            </a>
                            <ul class="sub-menu">
                                <li>
                                    <span class="text sub-menu-title">用户管理</span>
                                </li>
                                <li>
                                    <a href="#">
                                        <span class="text">用户</span>
                                    </a>
                                </li>
                                <li>
                                    <a href="#">
                                        <span class="text">用户</span>
                                    </a>
                                </li>
                            </ul>
                        </li>

                        <li>
                            <a href="#">
                                <i class="iconfont icon-file-text"></i>
                                <span class="text">邮件</span>
                            </a>
                        </li>

                        <li>
                            <a href="#">
                                <i class="iconfont icon-calendar"></i>
                                <span class="text">收益</span>
                            </a>
                        </li>

                        <li>
                            <a href="#">
                                <i class="iconfont icon-star"></i>
                                <span class="text">我的收藏</span>
                                <i class="iconfont icon-down arrow"></i>
                            </a>
                            <ul class="sub-menu">
                                <li>
                                    <span class="text sub-menu-title">我的收藏</span>
                                </li>
                                <li>
                                    <a href="#">
                                        <span class="text">默认收藏</span>
                                    </a>
                                </li>
                                <li>
                                    <a href="#">
                                        <span class="text">用户</span>
                                    </a>
                                </li>
                                <li>
                                    <a href="#">
                                        <span class="text">默认收藏</span>
                                    </a>
                                </li>
                                <li>
                                    <a href="#">
                                        <span class="text">用户</span>
                                    </a>
                                </li>
                            </ul>
                        </li>

                    </ul>
                </div>

                <div class="menu">
                    <p class="title">Settings</p>
                    <ul>

                        <li class="">
                            <a href="#">
                                <i class="iconfont icon-setting"></i>
                                <span class="text">设置</span>
                            </a>
                        </li>

                    </ul>
                </div>
            </div>

            <!-- 侧边栏底部 -->
            <div class="menu">
                <p class="title">Account</p>
                <ul>
                    <li class="">
                        <a href="#">
                            <i class="iconfont icon-info"></i>
                            <span class="text">帮助</span>
                        </a>
                    </li>
                    <li class="">
                        <a href="#">
                            <i class="iconfont icon-logout"></i>
                            <span class="text">退出</span>
                        </a>
                    </li>
                </ul>
            </div>

        </div>

        <section class="home-section">
            <div class="home-section-title">
                <div class="menu-btn">
                    <i class="iconfont icon-unorderedlist"></i>
                </div>
            </div>

        </section>
    </div>

    <script src="../../js/jquery-3.7.1.js"></script>
    <script src="./script.js"></script>
</body>

</html>
