<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录页面</title>
    <!-- <link rel="stylesheet" href="../js/jquery-3.7.1.js"> -->
    <style>
        * {
            padding: 0;
            margin: 0;
            transition: .3s;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-image: url(../img/前端好看壁纸图片/13.jpg);
            background-size: cover;
        }

        .headTit {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100px;
            align-items: center;
            flex-direction: column;
            background-color: #ffffff49;
        }

        .headTitle {
            font-size: 60px;
            color: #fff;
            margin-left: 12px;
            margin-top: 5px;
            text-shadow: 0 0 10px #ff9dff80;
            letter-spacing: 5px;
        }

        .logo {
            position: fixed;
            top: 0px;
            right: 10px;
            width: 100px;
            height: 100px;
            border-radius: 10px;
        }

        .shell {
            width: 350px;
            padding: 40px;
            display: flex;
            align-items: center;
            flex-direction: column;
            background-color: #ffffff49;
            border-radius: 50px;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.5) inset;
        }

        .title {
            font-size: 55px;
            margin-bottom: 30px;
            color: #fff;
            text-shadow: 0 0 10px #ff9dff80;
            letter-spacing: 3px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            height: 50px;
            margin: 10px 0;
            box-sizing: border-box;
            color: rgb(0, 0, 0);
            border: 5px solid transparent;
            background: rgba(255, 255, 255, .5);
            border-radius: 100px;
            padding: 5px 20px 0 20px;
            transition: 0.3s;
            font-size: 18px;
            outline: none;
        }

        input[type="text"]:hover,
        input[type="password"]:hover {
            background-color: rgba(255, 255, 255, 0);
            border: 5px solid #ffffff;
        }

        input[type="submit"] {
            width: 100%;
            height: 50px;
            padding: 10px;
            margin: 15px 0;
            border-radius: 100px;
            border: none;
            background-color: #007bff;
            color: #fff;
            cursor: pointer;
            font-size: 20px;
            letter-spacing: 3px;
        }

        input::placeholder {
            color: #92a7e8;
        }
    </style>
</head>

<body>
    <div class="headTit">
        <h1 class="headTitle">学生成绩管理系统</h1>
        <img class="logo" src="../img/沙雕猫/sd8.gif" alt="xd">
    </div>
    <div class="shell">
        <h2 class="title">系统登录</h2>
        <input type="text" name="" id="username" placeholder="用户名">
        <input type="password" name="" id="password" placeholder="密码">
        <input type="submit" value="登录" id="loginBtn">
    </div>
</body>
<script src="../js/jquery-3.7.1.js"></script>
<script>



    $(document).ready(function () {
        // 禁用后退按钮
        history.pushState(null, null, location.href);
        window.onpopstate = function () {
            history.go(1);
        };

        // 监听浏览器后退按钮点击事件
        window.addEventListener('popstate', function (event) {
            // 禁止后退操作
            history.pushState(null, null, location.href);
        });


        $("#loginBtn").click(function () {
            if ($("#username").val() == '' || $("#password").val() == '') {
                alert("用户名或密码不能为空")
            } else {
                window.location.replace('menu_2.html')
            }
        })
    })



</script>


</html>
